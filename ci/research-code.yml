name: Research code validation
on:
  push:
    branches: [main, release/research-code]
    paths: ['src/**', 'tests/**', 'pyproject.toml', 'training/**', '.github/workflows/research-code.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'pyproject.toml', 'training/**', '.github/workflows/research-code.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU evaluation package
        run: python -m pip install -e '.[download,report,construction,test]'
      - name: Compile and build package
        run: |
          python -m compileall -q src
          python -m build
          plantagentbench --help
          bash -n training/train.sh
      - name: Unit tests (no API calls)
        run: python -m pytest tests/test_public.py -q
      - name: Download pinned public Core snapshot
        run: plantagentbench download --dataset core --output /tmp/pab-core
      - name: Real frozen evidence and scorer integration (scripted only)
        env:
          PAB_TEST_DATASET: /tmp/pab-core
        run: python -m pytest tests/test_frozen.py -q
